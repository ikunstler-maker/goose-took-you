<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Гусь тебе побрав</title>
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <header id="topbar">
      <strong id="title"></strong>
      <span id="seed"></span>
      <button id="new-office" type="button"></button>
      <div id="sound" role="group">
        <button id="mute" type="button"></button>
        <input id="volume" type="range" min="0" max="100" step="5" />
      </div>
      <div id="lang" role="group">
        <button type="button" data-lang="ua">UA</button>
        <button type="button" data-lang="ru">RU</button>
      </div>
    </header>
    <div id="progress"><span></span><div class="bar"><div class="fill"></div></div></div>
    <div id="room-name"></div>
    <aside id="tasks"><h2></h2><ul></ul><p class="sabotage" hidden></p></aside>
    <div id="alarm" hidden><strong></strong><span></span><div class="bar"><div class="fill"></div></div></div>
    <div id="prompt" hidden></div>
    <div id="shout" hidden></div>
    <div id="minigame" hidden></div>
    <section id="lobby" hidden></section>
    <div id="banner" hidden><strong></strong><span></span></div>
    <section id="meeting" hidden></section>
    <section id="over" hidden><h2></h2><p class="over-you"></p><p class="over-reason"></p><p class="over-goose"></p><button type="button"></button></section>
    <footer id="controls"></footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
